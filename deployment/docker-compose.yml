include:
  - path: ./docker-compose.milvus.yml

services:
  # api_server:
  #   container_name: "api_server"
  #   build:
  #     context: ../backend
  #     dockerfile: Dockerfile
  #   restart: always
  #   env_file:
  #     - ../.env
  #   ports:
  #     - 8000:8000
  postgres:
      image: postgres:18-alpine3.23
      container_name: postgres
      restart: always
      environment:
        - POSTGRES_USER=${POSTGRES_USER:-postgres}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
        - POSTGRES_DB=${POSTGRES_DB:-postgres}
      env_file:
        - ../.env
      ports:
        - 5432:5432
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}'"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s
  # Application object store for source documents (PDFs/guidelines).
  # This is SEPARATE from Milvus's internal MinIO (see docker-compose.milvus.yml):
  # different credentials, volume, bucket, and host ports. The two never overlap.
  # Reachable from the host at :7000 (API) / :7001 (console); the app connects via
  # MINIO_ENDPOINT_URL (default http://localhost:7000).
  minio_local:
    image: minio/minio:latest
    container_name: minio_local
    environment:
      - MINIO_ROOT_USER=${MINIO_USERNAME:-abcd}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-abcd2345}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data_local:/minio_data
    ports:
      - "7000:9000"
      - "7001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Creates the application bucket once minio_local is healthy. The official
  # minio/minio image does not auto-create buckets, so we provision it explicitly
  # using the same name the app reads from MINIO_BUCKET_NAME (default "default").
  minio_local_init:
    image: minio/mc:latest
    container_name: minio_local_init
    depends_on:
      minio_local:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set app http://minio_local:9000 '${MINIO_USERNAME:-abcd}' '${MINIO_PASSWORD:-abcd2345}' &&
      mc mb --ignore-existing app/'${MINIO_BUCKET_NAME:-default}' &&
      echo 'Application bucket ready: ${MINIO_BUCKET_NAME:-default}'
      "

volumes:
  postgres_data:
  minio_data_local:
